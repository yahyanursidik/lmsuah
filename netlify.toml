[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # This is the public application origin, not an authentication credential.
  # Keep scanning all other keys, including database credentials and OAuth secrets.
  # Bucket names, endpoints and regions are public; credentials remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "BETTER_AUTH_URL,S3_ENDPOINT,S3_BUCKET,S3_REGION,S3_PUBLIC_URL"
